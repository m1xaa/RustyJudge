[package]
name = "rusty_judge"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[dependencies]
rslint_parser = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
url = "2.5.8"
tower-lsp = "0.20.0"
sysinfo = "0.38.4"

[[bench]]
name = "rustyjudge_benchmark"
harness = false


